name: cropai
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.7.1
      - torchvision
      - segmentation-models-pytorch==0.5.0
      - timm
      - albumentations==2.0.8
      - opencv-python-headless
      - numpy
      - pandas
      - scipy
      - scikit-image
      - imagehash
      - matplotlib
      - tqdm
      - psutil
      - onnx
      - onnxruntime
      - pillow
